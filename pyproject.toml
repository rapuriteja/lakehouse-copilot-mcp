[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-copilot"
version = "0.1.0"
description = "AI copilot for a data lakehouse: medallion pipeline, RAG over the data catalog, and an MCP server with safe SQL tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rapuri Teja", email = "rapuriteja@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "duckdb>=1.1",
    "sqlglot>=25",
    "mcp>=2.0",
    "openai>=1.50",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<5"]
azure = ["azure-search-documents>=11.6"]
databricks = ["databricks-sql-connector>=3.4"]
ui = ["streamlit>=1.38"]
dev = [
    "lakehouse-copilot[spark,ui,azure]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lhc = "lakehouse_copilot.cli:main"
lakehouse-job = "lakehouse_copilot.databricks_job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
