[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-copilot"
version = "0.1.0"
description = "AI copilot for a data lakehouse: medallion pipeline, RAG over the data catalog, and an MCP server with safe SQL tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rapuri Teja", email = "rapuriteja@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<5"]
dev = [
    "lakehouse-copilot[spark]",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lhc = "lakehouse_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
