# Golden question set for the evaluation harness.
#
# split: dev  = questions used while building the offline planner and the retriever
#        test = held-out questions, written before running them, never used for tuning
# relevant_docs: catalog chunk ids that answer the question (a hit = any of them retrieved)
# gold_sql: hand-written SQL whose result is the correct answer
# order_matters: compare rows in order (only for "top N" and time trends)

questions:
  # ------------------------------------------------------------------ dev
  - id: d01
    split: dev
    question: What was the total net revenue in 2024?
    relevant_docs: [metric:net_revenue, rule:revenue_recognition]
    gold_sql: |
      SELECT SUM(CASE WHEN f.is_revenue THEN f.net_amount END)
      FROM gold.fact_sales f JOIN gold.dim_date d ON f.date_key = d.date_key
      WHERE d.year = 2024

  - id: d02
    split: dev
    question: How many orders did we get in 2025?
    relevant_docs: [metric:order_count]
    gold_sql: |
      SELECT COUNT(DISTINCT CASE WHEN f.is_revenue THEN f.order_id END)
      FROM gold.fact_sales f JOIN gold.dim_date d ON f.date_key = d.date_key
      WHERE d.year = 2025

  - id: d03
    split: dev
    question: Top 5 cities by net revenue in 2025
    relevant_docs: [metric:net_revenue, rule:customer_city_history, table:gold.agg_monthly_city_sales]
    order_matters: true
    gold_sql: |
      SELECT c.city, SUM(CASE WHEN f.is_revenue THEN f.net_amount END) AS revenue
      FROM gold.fact_sales f
      JOIN gold.dim_date d ON f.date_key = d.date_key
      JOIN gold.dim_customer c ON f.customer_sk = c.customer_sk
      WHERE d.year = 2025 GROUP BY 1 ORDER BY 2 DESC LIMIT 5

  - id: d04
    split: dev
    question: Which payment method has the most orders?
    relevant_docs: [metric:order_count, columns:gold.fact_sales:2]
    gold_sql: |
      SELECT payment_method, COUNT(DISTINCT CASE WHEN is_revenue THEN order_id END)
      FROM gold.fact_sales GROUP BY 1 ORDER BY 2 DESC LIMIT 1

  - id: d05
    split: dev
    question: What is the average order value for UPI vs COD?
    relevant_docs: [metric:average_order_value]
    gold_sql: |
      SELECT payment_method,
             SUM(CASE WHEN is_revenue THEN net_amount END)
             / COUNT(DISTINCT CASE WHEN is_revenue THEN order_id END)
      FROM gold.fact_sales WHERE payment_method IN ('UPI', 'COD') GROUP BY 1

  - id: d06
    split: dev
    question: Monthly net revenue trend in 2025
    relevant_docs: [metric:net_revenue, columns:gold.dim_date:2]
    order_matters: true
    gold_sql: |
      SELECT d.year_month, SUM(CASE WHEN f.is_revenue THEN f.net_amount END)
      FROM gold.fact_sales f JOIN gold.dim_date d ON f.date_key = d.date_key
      WHERE d.year = 2025 GROUP BY 1 ORDER BY 1

  - id: d07
    split: dev
    question: Net revenue by category during the Diwali festive season 2024
    relevant_docs: [rule:festive_season_definition, glossary:festive_season]
    gold_sql: |
      SELECT p.category, SUM(CASE WHEN f.is_revenue THEN f.net_amount END)
      FROM gold.fact_sales f
      JOIN gold.dim_date d ON f.date_key = d.date_key
      JOIN gold.dim_product p ON f.product_sk = p.product_sk
      WHERE d.year = 2024 AND d.is_festive_season GROUP BY 1

  - id: d08
    split: dev
    question: Which category has the highest gross margin percentage?
    relevant_docs: [metric:gross_margin_pct]
    gold_sql: |
      SELECT p.category,
             100.0 * SUM(CASE WHEN f.is_revenue THEN f.margin_amount END)
             / SUM(CASE WHEN f.is_revenue THEN f.net_amount END)
      FROM gold.fact_sales f JOIN gold.dim_product p ON f.product_sk = p.product_sk
      GROUP BY 1 ORDER BY 2 DESC LIMIT 1

